<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content=""This site serves as a professional hybrid portfolio showcasing my expertise as a Technical Artist and Software Developer. It features high-quality 3D models created in Maya alongside web development projects and C# logic. ">
    <meta name="author" content="Christian Pena">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js"></script>
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Product Review Form</h1>
    </header>

<main>
    <form method="get" action="review.html">
        <fieldset>
            <legend>Product Review</legend>
            <label for="product">Product Name:</label>
            <select name="product" id="product" required>
                <option value="" Select a Product</option>
            </select>

            <label>Overall Rating:</label>
            <div class="rating">
                <input type="radio" name="rating" id="star1" value="1" required><label for="star1">★</label>
                <input type="text" name="rating" id="star2" value="2"><label for="star2">★★</label>
                <input type="text" name="rating" id="star3" value="3"><label for="star3">★★★</label>
                <input type="text" name="rating" id="star4" value="4"><label for="star4">★★★★</label>
                <input type="text" name="rating" id="star5" value="5"><label for="star5">★★★★★</label>
            </div>
            <label for="install-date">Date of Installation:</label>
            <input type="date" id="install-date" name="install-date" required>

            <label>Useful Features:</label>
            <label><input type="checkbox" name="features" value="durability">Durability</label>
            <label><input type="checkbox" name="features" value="ease">Ease of Use</label>
            <label><input type="checkbox" name="features" value="design">Design</label>

            <label for="review">Written Review(optional)</label>
            <textarea name="review" id="review" rows="4"></textarea>

            <label for="user">Your NAme:</label>
            <input type="text" id="user" name="user">

            <input type="submit" value="Post Product Review">
        </fieldset>
    </form>
    <footer>
        <p>Christian Pena</p>
    </footer>
</main>
</body>

</html>
