<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cucuta - City Page</title>
    <meta name="description" content="General information and weather in Cucuta city, Colombia!!! ">
    <meta name="author" content="Christian Pena">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="larger.css" media="(min-width: 600px)">
    <script src="/scripts/getdates.js" defer></script>
    <script src="place.js" defer></script>

</head>

<body>
    <div class="hero">
        <picture>
            <source srcset="images/bird-large.webp" media="(min-width: 600px)">
            <img src="images/bird-small.webp" alt="birds" loading="lazy">

        </picture>
    </div>
    <main>
        <section class="content">


            <section class="card data">
                <h2>Data</h2>
                <p><span>City:</span> Cucuta</p>
                <p><span>Department:</span> Norte de Santander</p>
                <p><span>Population:</span> ~800,000</p>
                <p><span>Elevation:</span> 320 m</p>
                <p><span>Climate:</span> Tropical dry</p>
            </section>
            <section class="card weather">
                <h2>Weather</h2>
                <img src="images/weather.svg" alt="Weather icon" class="weather-icon">
                <p><span>Temperature:</span> <span id="temp">34</span> °C</p>
                <p><span>Wind Speed:</span> <span id="wind">10</span> km/h</p>
                <p><span>Condition:</span> Sunny</p>
                <p><span>Wind Chill:</span> <span id="windchill">N/A</span></p>
            </section>
        </section>
    </main>


    <footer>
        <p>
            © <span id="year"></span> | Christian Pena | Cúcuta, Colombia
        </p>
        <p>Last modified: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
